<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Libre+Baskerville:wght@400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 400px; height: 400px; overflow: hidden; }
  body {
    background: radial-gradient(circle at 50% 40%, #2D5280 0%, #1E3A5F 70%);
    display: flex; align-items: center; justify-content: center;
  }
  .ring {
    width: 320px; height: 320px; border-radius: 50%;
    border: 2px solid #F7F3ED;
    box-shadow: 0 0 0 8px #1E3A5F, 0 0 0 9px rgba(247,243,237,0.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #F7F3ED; text-align: center;
  }
  .top {
    font-family: 'Libre Baskerville', Georgia, serif;
    font-size: 17px; letter-spacing: 0.32em; text-transform: uppercase;
    padding-left: 0.32em; margin-bottom: 14px;
  }
  .main {
    font-family: 'EB Garamond', Georgia, serif;
    font-style: italic; font-weight: 400; font-size: 68px; line-height: 0.95;
  }
  .rule { width: 40px; height: 1px; background: rgba(247,243,237,0.6); margin-top: 18px; }
</style>
</head>
<body>
  <div class="ring">
    <div class="top">Cercle</div>
    <div class="main">Vente<br>Directe</div>
    <div class="rule"></div>
  </div>
</body>
</html>
